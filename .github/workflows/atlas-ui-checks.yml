name: Atlas UI checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: atlas-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_BASE_PATH: /ai-atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: node tests/static.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-ui-preview
          path: out/
          include-hidden-files: true
          retention-days: 7
